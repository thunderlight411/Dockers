services:
  proxmox-qdevice:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: proxmox-qdevice

    restart: unless-stopped

    environment:
      ROOT_PASSWORD: "CHANGE-THIS-PASSWORD"

    ports:
      - "5403:5403/tcp"
      - "2222:22/tcp"

    volumes:
      - ./data/corosync:/etc/corosync/qnetd
      - ./data/ssh:/root/.ssh

    cap_drop:
      - ALL
    # Required for sshd to bind the container's privileged TCP port 22.
    cap_add:
      - NET_BIND_SERVICE

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "corosync-qnetd-tool", "-s"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
